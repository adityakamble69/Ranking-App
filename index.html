<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <title>Learning Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root,
    [data-theme="dark"] {
      --bg: #04060f;
      --surface: rgba(10, 16, 30, 0.72);
      --surface-2: rgba(20, 28, 50, 0.6);
      --border: rgba(80, 200, 255, 0.18);
      --border-strong: rgba(80, 220, 255, 0.55);
      --text: #e8f4ff;
      --text-2: #a8bcd8;
      --muted: #6b7a99;
      --neon: #4ad9e4;
      --neon-2: #7c5cff;
      --gold: #ffd166;
      --danger: #ff4d6a;
      --bg-overlay: rgba(4, 8, 20, 0.78);
      --scanline: rgba(255, 255, 255, 0.02);
      --radius: 14px;
    }

    [data-theme="light"] {
      --bg: #eef3fa;
      --surface: rgba(255, 255, 255, 0.85);
      --surface-2: rgba(240, 245, 252, 0.9);
      --border: rgba(60, 90, 180, 0.18);
      --border-strong: rgba(60, 120, 220, 0.5);
      --text: #0c1a2e;
      --text-2: #3a4a68;
      --muted: #6b7a99;
      --neon: #0891a8;
      --neon-2: #6d3fe0;
      --gold: #c99400;
      --danger: #d63048;
      --bg-overlay: rgba(230, 238, 250, 0.82);
      --scanline: rgba(0, 0, 0, 0.015);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      background:
        linear-gradient(var(--bg-overlay), var(--bg-overlay)),
        url('bg.jpg') center/cover no-repeat fixed,
        var(--bg);
      padding: 32px 16px 72px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
      transition: background-color .4s, color .3s;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        repeating-linear-gradient(0deg, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 3px),
        radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
      mix-blend-mode: overlay;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .7;
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* Top toolbar */
    .toolbar {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 100;
      display: flex;
      gap: 8px;
    }

    .tool-btn {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .18s;
    }

    .tool-btn:hover {
      border-color: var(--neon);
      box-shadow: 0 0 14px rgba(74, 217, 228, 0.35);
      transform: translateY(-1px);
    }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background:
        radial-gradient(circle at 50% 45%, rgba(74, 217, 228, 0.10), transparent 55%),
        rgba(3, 5, 14, 0.96);
      transition: opacity .55s ease, visibility .55s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-emblem {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatY 2.6s ease-in-out infinite;
    }

    @keyframes floatY {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .loader-emblem::before,
    .loader-emblem::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 22px;
      border: 2px solid transparent;
    }

    .loader-emblem::before {
      border-top-color: var(--neon);
      border-right-color: var(--neon-2);
      animation: spin 1.4s linear infinite;
    }

    .loader-emblem::after {
      inset: 14px;
      border-bottom-color: var(--neon);
      border-left-color: var(--neon-2);
      animation: spin 1.8s linear infinite reverse;
    }

    .loader-emblem span {
      font-size: 34px;
      filter: drop-shadow(0 0 14px rgba(74, 217, 228, 0.6));
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      letter-spacing: 6px;
      font-weight: 700;
      color: var(--neon);
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(74, 217, 228, 0.7);
    }

    .loader-bar {
      width: 220px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }

    .loader-bar::after {
      content: "";
      position: absolute;
      left: -40%;
      top: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, var(--neon), var(--neon-2), transparent);
      animation: slide 1.2s ease-in-out infinite;
      box-shadow: 0 0 12px var(--neon);
    }

    @keyframes slide {
      0% {
        left: -40%;
      }

      100% {
        left: 100%;
      }
    }

    /* Hero */
    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .hero .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--neon-2), var(--neon));
      font-size: 30px;
      box-shadow: 0 0 28px rgba(74, 217, 228, 0.55), inset 0 0 18px rgba(255, 255, 255, 0.15);
      animation: pulseGlow 2.5s ease-in-out infinite;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        box-shadow: 0 0 28px rgba(74, 217, 228, 0.55), inset 0 0 18px rgba(255, 255, 255, 0.15);
      }

      50% {
        box-shadow: 0 0 42px rgba(124, 92, 255, 0.7), inset 0 0 22px rgba(255, 255, 255, 0.25);
      }
    }

    .hero h1 {
      margin: 0 0 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--neon), #ffffff, var(--neon-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(74, 217, 228, 0.3);
      position: relative;
    }

    [data-theme="light"] .hero h1 {
      background: linear-gradient(90deg, var(--neon), #000, var(--neon-2));
      -webkit-background-clip: text;
      background-clip: text;
    }

    .hero h1::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      top: 0;
      color: var(--danger);
      opacity: 0;
      pointer-events: none;
      animation: glitch 6s infinite;
    }

    @keyframes glitch {

      0%,
      92%,
      100% {
        opacity: 0;
        transform: translate(0);
      }

      93% {
        opacity: .7;
        transform: translate(-2px, 1px);
      }

      94% {
        opacity: .7;
        transform: translate(2px, -1px);
      }

      95% {
        opacity: 0;
      }
    }

    .hero p {
      margin: 0;
      color: var(--text-2);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Card */
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      padding: 26px 24px;
      margin-bottom: 16px;
      animation: fadeUp .45s ease both;
      overflow: hidden;
      transition: transform .3s ease;
    }

    .card.holo:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 54px rgba(0, 0, 0, 0.45), 0 0 34px rgba(74, 217, 228, 0.15);
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      pointer-events: none;
      border-color: var(--neon);
      opacity: 0.7;
    }

    .card::before {
      top: 6px;
      left: 6px;
      border-top: 2px solid;
      border-left: 2px solid;
    }

    .card::after {
      bottom: 6px;
      right: 6px;
      border-bottom: 2px solid;
      border-right: 2px solid;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card {
      max-width: 400px;
      margin: 40px auto 0;
    }

    .login-card h2 {
      margin: 0 0 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .login-card p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    input[type=text] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(6, 10, 22, 0.72);
      color: var(--text);
      font-size: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
      outline: none;
      font-family: 'Orbitron', sans-serif;
      font-weight: 500;
      transition: all .18s;
    }

    [data-theme="light"] input[type=text] {
      background: rgba(255, 255, 255, 0.9);
    }

    input[type=text]::placeholder {
      text-transform: none;
      letter-spacing: 0.5px;
      color: #4a5674;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 500;
    }

    input[type=text]:focus {
      border-color: var(--neon);
      background: rgba(10, 20, 40, 0.85);
      box-shadow: 0 0 0 3px rgba(74, 217, 228, 0.15), 0 0 22px rgba(74, 217, 228, 0.28);
    }

    [data-theme="light"] input[type=text]:focus {
      background: rgba(255, 255, 255, 0.95);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: transform .12s, box-shadow .2s, background .15s;
      position: relative;
      overflow: hidden;
    }

    button:active {
      transform: scale(0.98);
    }

    .ripple {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      animation: rippleAnim .6s ease-out;
    }

    @keyframes rippleAnim {
      to {
        transform: translate(-50%, -50%) scale(20);
        opacity: 0;
      }
    }

    .btn-primary {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      color: #030710;
      font-weight: 800;
      font-size: 13px;
      border-radius: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, var(--neon), var(--neon-2));
      box-shadow: 0 0 24px rgba(74, 217, 228, 0.5), inset 0 0 12px rgba(255, 255, 255, 0.15);
    }

    .btn-primary::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      transform: skewX(-20deg);
      animation: shine 3s ease-in-out infinite;
    }

    @keyframes shine {

      0%,
      100% {
        left: -60%;
      }

      50% {
        left: 120%;
      }
    }

    .btn-primary:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn-primary:disabled::after {
      animation: none;
    }

    .error {
      color: #ff7c92;
      font-size: 12.5px;
      margin-top: 10px;
      min-height: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .hidden {
      display: none !important;
    }

    /* Profile */
    .profile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .profile .left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .avatar {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 22px;
      color: #030710;
      box-shadow: 0 0 22px rgba(74, 217, 228, 0.5);
      position: relative;
    }

    .avatar.rank-1 {
      background: linear-gradient(135deg, #ffd166, #b8860b);
      box-shadow: 0 0 26px rgba(255, 209, 102, 0.55);
    }

    .avatar.rank-2 {
      background: linear-gradient(135deg, #cbd5e1, #8a94a6);
      box-shadow: 0 0 24px rgba(203, 213, 225, 0.5);
    }

    .avatar.rank-3 {
      background: linear-gradient(135deg, #e0a56f, #8a5a2e);
      box-shadow: 0 0 24px rgba(224, 165, 111, 0.5);
    }

    .avatar.rank-other {
      background: linear-gradient(135deg, var(--neon-2), var(--neon));
    }

    .profile .name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .profile .code {
      font-family: 'Orbitron', sans-serif;
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 5px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .stat {
      text-align: right;
      flex-shrink: 0;
    }

    .stat .num {
      font-family: 'Orbitron', sans-serif;
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(90deg, var(--neon), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
      filter: drop-shadow(0 0 14px rgba(74, 217, 228, 0.5));
    }

    .stat .label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 2.5px;
      margin-top: 6px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* XP Bar */
    .xp-wrap {
      margin-top: 18px;
    }

    .xp-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .xp-meta .target {
      color: var(--neon);
    }

    .xp-bar {
      height: 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
    }

    .xp-fill {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--neon), var(--neon-2));
      box-shadow: 0 0 12px rgba(74, 217, 228, 0.55);
      width: 0%;
      transition: width 1.2s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    .xp-caption {
      margin-top: 8px;
      font-size: 11.5px;
      color: var(--muted);
      letter-spacing: 0.6px;
      text-align: center;
    }

    .xp-caption b {
      color: var(--neon);
      font-weight: 700;
    }

    /* Section title */
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--neon);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin: 32px 4px 14px;
      text-shadow: 0 0 12px rgba(74, 217, 228, 0.5);
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(74, 217, 228, 0.55), transparent);
    }

    /* Podium */
    .podium {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: end;
      gap: 8px;
      margin-bottom: 16px;
    }

    .podium .pod {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 8px 12px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      animation: podiumPop .6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      position: relative;
    }

    @keyframes podiumPop {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.9);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .podium .p1 {
      grid-column: 2;
      padding-top: 24px;
      border-color: rgba(255, 209, 102, 0.5);
      box-shadow: 0 0 24px rgba(255, 209, 102, 0.2);
      animation-delay: .05s;
    }

    .podium .p2 {
      grid-column: 1;
      grid-row: 1;
      border-color: rgba(203, 213, 225, 0.4);
      animation-delay: .15s;
    }

    .podium .p3 {
      grid-column: 3;
      grid-row: 1;
      border-color: rgba(224, 165, 111, 0.4);
      animation-delay: .25s;
    }

    .podium .pod img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
    }

    .podium .pod .pod-name {
      font-size: 11.5px;
      font-weight: 700;
      margin-top: 8px;
      text-align: center;
      line-height: 1.3;
      color: var(--text);
      word-break: break-word;
    }

    .podium .pod .pod-pts {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--neon);
      margin-top: 4px;
      letter-spacing: 0.6px;
    }

    .podium .pod .crown {
      position: absolute;
      top: -14px;
      font-size: 18px;
      filter: drop-shadow(0 0 8px rgba(255, 209, 102, 0.8));
    }

    .podium .p1 .crown {
      animation: bounce 1.8s infinite;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    /* Task rows */
    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
      transition: all .18s;
    }

    .task-row::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--neon), var(--neon-2));
      box-shadow: 0 0 12px var(--neon);
      transition: all .3s;
    }

    .task-row:hover {
      border-color: var(--border-strong);
      transform: translateX(2px);
    }

    .task-row.done::before {
      background: linear-gradient(180deg, #4ade80, var(--neon));
    }

    .task-row .t-name {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
      position: relative;
    }

    .task-row .t-name .check {
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-right: 6px;
      vertical-align: -3px;
      color: #4ade80;
      opacity: 0;
      animation: checkIn .5s ease forwards;
    }

    @keyframes checkIn {
      to {
        opacity: 1;
      }
    }

    .task-row .t-link {
      display: inline-block;
      font-size: 11px;
      color: var(--neon);
      text-decoration: none;
      margin-top: 5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .task-row .t-link:hover {
      text-shadow: 0 0 12px var(--neon);
    }

    .task-row .t-pts {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(124, 92, 255, 0.16);
      color: #c7bcff;
      white-space: nowrap;
      letter-spacing: 1px;
      border: 1px solid rgba(124, 92, 255, 0.4);
    }

    .task-row.done .t-pts {
      background: rgba(74, 217, 228, 0.16);
      color: #b8f4ff;
      border-color: rgba(74, 217, 228, 0.5);
    }

    /* Leaderboard rows */
    .lb-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 7px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      transition: all .18s;
    }

    .lb-row:hover {
      transform: translateX(2px);
      border-color: var(--border-strong);
    }

    .lb-row.me {
      border-color: var(--neon);
      background: linear-gradient(90deg, rgba(74, 217, 228, 0.10), rgba(124, 92, 255, 0.06));
      box-shadow: 0 0 0 1px var(--neon), 0 0 26px rgba(74, 217, 228, 0.28);
    }

    .lb-name {
      flex: 1;
      font-size: 13.5px;
      font-weight: 700;
      min-width: 0;
      letter-spacing: 0.3px;
    }

    .lb-pts {
      font-family: 'Orbitron', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--neon);
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(74, 217, 228, 0.5);
    }

    .rank-delta {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 5px;
      margin-left: 6px;
      letter-spacing: 0.6px;
    }

    .rank-delta.up {
      color: #4ade80;
      background: rgba(74, 222, 128, 0.12);
    }

    .rank-delta.down {
      color: #ff7c92;
      background: rgba(255, 124, 146, 0.12);
    }

    /* Rank badges */
    .rank-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-2);
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .rank-badge.img {
      width: 52px;
      height: 52px;
      border-radius: 0;
      background: none;
      border: none;
      filter: drop-shadow(0 6px 16px rgba(74, 217, 228, 0.5));
      animation: badgePop .6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .rank-badge.img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes badgePop {
      from {
        opacity: 0;
        transform: scale(0.4) rotate(-14deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .empty {
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
      padding: 22px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: rgba(10, 16, 30, 0.4);
      letter-spacing: 1px;
    }

    .logout {
      display: block;
      margin: 32px auto 0;
      background: transparent;
      color: var(--muted);
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: 1px solid var(--border);
      padding: 10px 22px;
      border-radius: 8px;
      transition: all .15s;
    }

    .logout:hover {
      color: var(--neon);
      border-color: var(--neon);
      box-shadow: 0 0 18px rgba(74, 217, 228, 0.35);
    }

    /* Toast */
    #toast-container {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9997;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      max-width: 92vw;
    }

    .toast {
      padding: 14px 20px;
      border-radius: 12px;
      background: rgba(10, 16, 30, 0.95);
      color: var(--text);
      border: 1px solid var(--border-strong);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
      opacity: 0;
      transform: translateY(-20px);
      transition: all .35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: auto;
      max-width: 440px;
      line-height: 1.5;
    }

    .toast.in {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-success {
      border-color: rgba(110, 231, 160, 0.5);
      box-shadow: 0 0 24px rgba(110, 231, 160, 0.25);
    }

    .toast-error {
      border-color: rgba(255, 124, 146, 0.55);
      box-shadow: 0 0 24px rgba(255, 124, 146, 0.3);
    }

    .toast-rankup {
      border-color: rgba(255, 209, 102, 0.65);
      background: linear-gradient(135deg, rgba(30, 20, 60, 0.98), rgba(10, 16, 30, 0.98));
      box-shadow: 0 0 40px rgba(255, 209, 102, 0.4), inset 0 0 20px rgba(255, 209, 102, 0.08);
      font-size: 14.5px;
    }
  </style>
</head>

<body>

  <canvas id="particles-canvas"></canvas>

  <div class="toolbar">
    <button class="tool-btn no-ripple" data-theme-toggle title="Toggle theme">☀</button>
    <button class="tool-btn no-ripple" data-sound-toggle title="Toggle sound">🔊</button>
  </div>

  <div id="loader">
    <div class="loader-emblem"><span>🏆</span></div>
    <div class="loader-text">Loading…</div>
    <div class="loader-bar"></div>
  </div>

  <div class="wrap">
    <div class="hero">
      <div class="badge">🏆</div>
      <h1 data-text="LEARNING ARENA">LEARNING ARENA</h1>
      <p>Complete · Compete · Conquer</p>
    </div>

    <div id="loginView" class="card login-card holo">
      <h2>Enter Your Code</h2>
      <p>Enter the unique code your teacher sent to your email.</p>
      <input id="codeInput" type="text" placeholder="e.g. K7NQ4X2M" autocomplete="off" spellcheck="false">
      <button class="btn-primary" id="loginBtn" onclick="doLogin()">Enter Arena</button>
      <div class="error" id="loginError"></div>
    </div>

    <div id="dashView" class="hidden">
      <div class="card holo">
        <div class="profile">
          <div class="left">
            <div class="avatar" id="avatarLetter">?</div>
            <div style="min-width:0;">
              <div class="name" id="studentName">—</div>
              <div class="code" id="studentCode">—</div>
            </div>
          </div>
          <div class="stat">
            <div class="num" id="totalPoints">0</div>
            <div class="label">Points</div>
          </div>
        </div>
        <div class="xp-wrap" id="xpWrap">
          <div class="xp-meta">
            <span>Progress to next rank</span>
            <span class="target" id="xpTarget">—</span>
          </div>
          <div class="xp-bar">
            <div class="xp-fill" id="xpFill"></div>
          </div>
          <div class="xp-caption" id="xpCaption"></div>
        </div>
      </div>

      <div class="section-title">🏆 Top Champions</div>
      <div id="podiumWrap" class="podium"></div>

      <div class="section-title">Your Tasks</div>
      <div id="taskList"></div>

      <div class="section-title">Full Leaderboard</div>
      <div id="leaderboardList"></div>

      <button class="logout" onclick="doLogout()">Log Out</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="effects.js"></script>
  <script src="student.js"></script>
</body>

</html>
