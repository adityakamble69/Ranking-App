<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Learning Task Ranking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #04060f;
      --surface: rgba(10, 16, 30, 0.72);
      --surface-2: rgba(20, 28, 50, 0.6);
      --border: rgba(80, 200, 255, 0.18);
      --border-strong: rgba(80, 220, 255, 0.55);
      --text: #e8f4ff;
      --text-2: #a8bcd8;
      --muted: #6b7a99;
      --neon: #4ad9e4;
      --neon-2: #7c5cff;
      --gold: #ffd166;
      --danger: #ff4d6a;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      background:
        linear-gradient(rgba(4, 8, 20, 0.78), rgba(4, 8, 20, 0.9)),
        url('bg.jpg') center/cover no-repeat fixed;
      padding: 32px 16px 72px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    /* Scanline + vignette overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 1px, transparent 1px, transparent 3px),
        radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
      mix-blend-mode: overlay;
    }

    .wrap {
      max-width: 580px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* ========= LOADING SCREEN ========= */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background:
        radial-gradient(circle at 50% 45%, rgba(74, 217, 228, 0.10), transparent 55%),
        rgba(3, 5, 14, 0.96);
      backdrop-filter: blur(8px);
      transition: opacity .55s ease, visibility .55s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-emblem {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatY 2.6s ease-in-out infinite;
    }

    @keyframes floatY {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .loader-emblem::before,
    .loader-emblem::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 22px;
      border: 2px solid transparent;
    }

    .loader-emblem::before {
      border-top-color: var(--neon);
      border-right-color: var(--neon-2);
      animation: spin 1.4s linear infinite;
    }

    .loader-emblem::after {
      inset: 14px;
      border-bottom-color: var(--neon);
      border-left-color: var(--neon-2);
      animation: spin 1.8s linear infinite reverse;
    }

    .loader-emblem span {
      font-family: 'Orbitron', sans-serif;
      font-size: 34px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon), var(--neon-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 14px rgba(74, 217, 228, 0.6));
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      letter-spacing: 6px;
      font-weight: 700;
      color: var(--neon);
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(74, 217, 228, 0.7);
    }

    .loader-bar {
      width: 220px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
      position: relative;
    }

    .loader-bar::after {
      content: "";
      position: absolute;
      left: -40%;
      top: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, var(--neon), var(--neon-2), transparent);
      animation: slide 1.2s ease-in-out infinite;
      box-shadow: 0 0 12px var(--neon);
    }

    @keyframes slide {
      0% {
        left: -40%;
      }

      100% {
        left: 100%;
      }
    }

    /* ========= HERO ========= */
    .hero {
      text-align: center;
      margin-bottom: 28px;
    }

    .hero .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--neon-2), var(--neon));
      font-size: 30px;
      box-shadow: 0 0 28px rgba(74, 217, 228, 0.55), inset 0 0 18px rgba(255, 255, 255, 0.15);
      animation: pulseGlow 2.5s ease-in-out infinite;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        box-shadow: 0 0 28px rgba(74, 217, 228, 0.55), inset 0 0 18px rgba(255, 255, 255, 0.15);
      }

      50% {
        box-shadow: 0 0 42px rgba(124, 92, 255, 0.7), inset 0 0 22px rgba(255, 255, 255, 0.25);
      }
    }

    .hero h1 {
      margin: 0 0 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(90deg, var(--neon), #ffffff, var(--neon-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(74, 217, 228, 0.3);
    }

    .hero p {
      margin: 0;
      color: var(--text-2);
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* ========= CARD (angled corners) ========= */
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      padding: 26px 24px;
      margin-bottom: 16px;
      animation: fadeUp .45s ease both;
      overflow: hidden;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      pointer-events: none;
      border-color: var(--neon);
      opacity: 0.7;
    }

    .card::before {
      top: 6px;
      left: 6px;
      border-top: 2px solid;
      border-left: 2px solid;
    }

    .card::after {
      bottom: 6px;
      right: 6px;
      border-bottom: 2px solid;
      border-right: 2px solid;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-card {
      max-width: 400px;
      margin: 40px auto 0;
    }

    .login-card h2 {
      margin: 0 0 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text);
      text-transform: uppercase;
    }

    .login-card p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* ========= INPUTS ========= */
    input[type=text] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(6, 10, 22, 0.72);
      color: var(--text);
      font-size: 16px;
      letter-spacing: 3px;
      text-transform: uppercase;
      outline: none;
      font-family: 'Orbitron', sans-serif;
      font-weight: 500;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }

    input[type=text]::placeholder {
      text-transform: none;
      letter-spacing: 0.5px;
      color: #4a5674;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 500;
    }

    input[type=text]:focus {
      border-color: var(--neon);
      background: rgba(10, 20, 40, 0.85);
      box-shadow: 0 0 0 3px rgba(74, 217, 228, 0.15), 0 0 22px rgba(74, 217, 228, 0.28);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: transform .12s, opacity .15s, box-shadow .2s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      position: relative;
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      color: #030710;
      font-weight: 800;
      font-size: 13px;
      border-radius: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, var(--neon), var(--neon-2));
      box-shadow: 0 0 24px rgba(74, 217, 228, 0.5), inset 0 0 12px rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    .btn-primary::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      transform: skewX(-20deg);
      animation: shine 3s ease-in-out infinite;
    }

    @keyframes shine {

      0%,
      100% {
        left: -60%;
      }

      50% {
        left: 120%;
      }
    }

    .btn-primary:disabled {
      opacity: .6;
      cursor: not-allowed;
      animation: none;
    }

    .error {
      color: #ff7c92;
      font-size: 12.5px;
      margin-top: 10px;
      min-height: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .hidden {
      display: none !important;
    }

    /* ========= PROFILE ========= */
    .profile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .profile .left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--neon-2), var(--neon));
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 22px;
      color: #030710;
      box-shadow: 0 0 22px rgba(74, 217, 228, 0.5);
    }

    .profile .name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .profile .code {
      font-family: 'Orbitron', sans-serif;
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 5px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .stat {
      text-align: right;
      flex-shrink: 0;
    }

    .stat .num {
      font-family: 'Orbitron', sans-serif;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--neon), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
      filter: drop-shadow(0 0 14px rgba(74, 217, 228, 0.5));
    }

    .stat .label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 2.5px;
      margin-top: 6px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* ========= SECTION TITLE ========= */
    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--neon);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin: 32px 4px 14px;
      text-shadow: 0 0 12px rgba(74, 217, 228, 0.5);
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(74, 217, 228, 0.55), transparent);
    }

    /* ========= TASK ROWS ========= */
    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      transition: border-color .18s, background .18s, transform .15s;
      position: relative;
      overflow: hidden;
    }

    .task-row::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--neon), var(--neon-2));
      box-shadow: 0 0 12px var(--neon);
    }

    .task-row:hover {
      border-color: var(--border-strong);
      transform: translateX(2px);
    }

    .task-row.done::before {
      background: linear-gradient(180deg, #4ade80, var(--neon));
    }

    .task-row .t-name {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .task-row .t-link {
      display: inline-block;
      font-size: 11px;
      color: var(--neon);
      text-decoration: none;
      margin-top: 5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .task-row .t-link:hover {
      text-shadow: 0 0 12px var(--neon);
    }

    .task-row .t-pts {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      background: rgba(124, 92, 255, 0.16);
      color: #c7bcff;
      white-space: nowrap;
      letter-spacing: 1px;
      border: 1px solid rgba(124, 92, 255, 0.4);
      box-shadow: 0 0 12px rgba(124, 92, 255, 0.2);
    }

    .task-row.done .t-pts {
      background: rgba(74, 217, 228, 0.16);
      color: #b8f4ff;
      border-color: rgba(74, 217, 228, 0.5);
      box-shadow: 0 0 12px rgba(74, 217, 228, 0.35);
    }

    /* ========= LEADERBOARD ========= */
    .lb-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 7px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      transition: border-color .18s, transform .15s;
      position: relative;
    }

    .lb-row:hover {
      transform: translateX(2px);
    }

    .lb-row.me {
      border-color: var(--neon);
      background: linear-gradient(90deg, rgba(74, 217, 228, 0.10), rgba(124, 92, 255, 0.06));
      box-shadow: 0 0 0 1px var(--neon), 0 0 26px rgba(74, 217, 228, 0.28);
    }

    .lb-row.top-tier {
      background: linear-gradient(90deg, rgba(124, 92, 255, 0.14), rgba(74, 217, 228, 0.06), transparent);
      border-color: rgba(124, 92, 255, 0.4);
    }

    .lb-name {
      flex: 1;
      font-size: 13.5px;
      font-weight: 700;
      min-width: 0;
      letter-spacing: 0.3px;
    }

    .lb-pts {
      font-family: 'Orbitron', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--neon);
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(74, 217, 228, 0.5);
    }

    /* ========= RANK BADGES ========= */
    .rank-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 12px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-2);
      border: 1px solid var(--border);
    }

    .rank-badge.img {
      width: 52px;
      height: 52px;
      border-radius: 0;
      background: none;
      border: none;
      filter: drop-shadow(0 6px 16px rgba(74, 217, 228, 0.5));
      animation: badgePop .6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .rank-badge.img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes badgePop {
      from {
        opacity: 0;
        transform: scale(0.4) rotate(-14deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .empty {
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
      padding: 22px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: rgba(10, 16, 30, 0.4);
      letter-spacing: 1px;
    }

    .logout {
      display: block;
      margin: 32px auto 0;
      background: transparent;
      color: var(--muted);
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: 1px solid var(--border);
      padding: 10px 22px;
      border-radius: 8px;
      transition: color .15s, border-color .15s, box-shadow .15s;
    }

    .logout:hover {
      color: var(--neon);
      border-color: var(--neon);
      box-shadow: 0 0 18px rgba(74, 217, 228, 0.35);
    }
  </style>
</head>

<body>

  <!-- ===== LOADING SCREEN ===== -->
  <div id="loader">
    <div class="loader-emblem"><span>🏆</span></div>
    <div class="loader-text">Loading…</div>
    <div class="loader-bar"></div>
  </div>

  <div class="wrap">
    <div class="hero">
      <div class="badge">🏆</div>
      <h1>LEARNING ARENA</h1>
      <p>Complete · Compete · Conquer</p>
    </div>

    <!-- LOGIN -->
    <div id="loginView" class="card login-card">
      <h2>Enter Your Code</h2>
      <p>Enter the unique code your teacher sent to your email.</p>
      <input id="codeInput" type="text" placeholder="e.g. STU042" autocomplete="off" spellcheck="false">
      <button class="btn-primary" id="loginBtn" onclick="doLogin()">Enter Arena</button>
      <div class="error" id="loginError"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashView" class="hidden">
      <div class="card">
        <div class="profile">
          <div class="left">
            <div class="avatar" id="avatarLetter">?</div>
            <div style="min-width:0;">
              <div class="name" id="studentName">—</div>
              <div class="code" id="studentCode">—</div>
            </div>
          </div>
          <div class="stat">
            <div class="num" id="totalPoints">0</div>
            <div class="label">Points</div>
          </div>
        </div>
      </div>

      <div class="section-title">Your Tasks</div>
      <div id="taskList"></div>

      <div class="section-title">Leaderboard</div>
      <div id="leaderboardList"></div>

      <button class="logout" onclick="doLogout()">Log Out</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="student.js"></script>
</body>

</html>
