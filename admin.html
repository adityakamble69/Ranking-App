<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8">
  <title>Admin · Learning Arena</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root,
    [data-theme="dark"] {
      --bg: #04060f;
      --surface: rgba(10, 16, 30, 0.72);
      --surface-2: rgba(20, 28, 50, 0.6);
      --border: rgba(80, 200, 255, 0.18);
      --border-strong: rgba(80, 220, 255, 0.55);
      --text: #e8f4ff;
      --text-2: #a8bcd8;
      --muted: #6b7a99;
      --neon: #4ad9e4;
      --neon-2: #7c5cff;
      --gold: #ffd166;
      --danger: #ff4d6a;
      --bg-overlay: rgba(4, 8, 20, 0.82);
      --scanline: rgba(255, 255, 255, 0.02);
      --radius: 14px;
    }

    [data-theme="light"] {
      --bg: #eef3fa;
      --surface: rgba(255, 255, 255, 0.85);
      --surface-2: rgba(240, 245, 252, 0.9);
      --border: rgba(60, 90, 180, 0.18);
      --border-strong: rgba(60, 120, 220, 0.5);
      --text: #0c1a2e;
      --text-2: #3a4a68;
      --muted: #6b7a99;
      --neon: #0891a8;
      --neon-2: #6d3fe0;
      --gold: #c99400;
      --danger: #d63048;
      --bg-overlay: rgba(230, 238, 250, 0.85);
      --scanline: rgba(0, 0, 0, 0.015);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      background:
        linear-gradient(var(--bg-overlay), var(--bg-overlay)),
        url('bg.jpg') center/cover no-repeat fixed,
        var(--bg);
      padding: 28px 18px 72px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
      transition: background-color .4s, color .3s;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        repeating-linear-gradient(0deg, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 3px),
        radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.55) 100%);
      mix-blend-mode: overlay;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: .65;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* ========= TOOLBAR ========= */
    .toolbar {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 100;
      display: flex;
      gap: 8px;
    }

    .tool-btn {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .18s;
      font-family: inherit;
    }

    .tool-btn:hover {
      border-color: var(--neon);
      box-shadow: 0 0 14px rgba(74, 217, 228, 0.35);
      transform: translateY(-1px);
    }

    /* ========= LOADER ========= */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background:
        radial-gradient(circle at 50% 45%, rgba(124, 92, 255, 0.14), transparent 55%),
        rgba(3, 5, 14, 0.96);
      backdrop-filter: blur(8px);
      transition: opacity .55s ease, visibility .55s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-emblem {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatY 2.6s ease-in-out infinite;
    }

    @keyframes floatY {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }
    }

    .loader-emblem::before,
    .loader-emblem::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 24px;
      border: 2px solid transparent;
    }

    .loader-emblem::before {
      border-top-color: var(--neon-2);
      border-right-color: var(--neon);
      animation: spin 1.4s linear infinite;
    }

    .loader-emblem::after {
      inset: 16px;
      border-bottom-color: var(--neon-2);
      border-left-color: var(--neon);
      animation: spin 1.8s linear infinite reverse;
    }

    .loader-emblem span {
      font-size: 38px;
      filter: drop-shadow(0 0 18px rgba(124, 92, 255, 0.7));
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loader-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      letter-spacing: 6px;
      font-weight: 700;
      color: var(--neon-2);
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(124, 92, 255, 0.8);
    }

    .loader-bar {
      width: 240px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
      position: relative;
    }

    .loader-bar::after {
      content: "";
      position: absolute;
      left: -40%;
      top: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, transparent, var(--neon-2), var(--neon), transparent);
      animation: slide 1.2s ease-in-out infinite;
      box-shadow: 0 0 12px var(--neon-2);
    }

    @keyframes slide {
      0% {
        left: -40%;
      }

      100% {
        left: 100%;
      }
    }

    /* ========= HEADER ========= */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand .logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--neon-2), var(--neon));
      font-size: 22px;
      box-shadow: 0 0 24px rgba(124, 92, 255, 0.55);
    }

    .brand h1 {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--neon), var(--neon-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    [data-theme="light"] .brand h1 {
      background: linear-gradient(90deg, var(--neon), var(--neon-2));
      -webkit-background-clip: text;
      background-clip: text;
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .logout-top {
      background: transparent;
      color: var(--muted);
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid var(--border);
      padding: 9px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s;
    }

    .logout-top:hover {
      color: var(--neon);
      border-color: var(--neon);
      box-shadow: 0 0 14px rgba(74, 217, 228, 0.35);
    }

    /* ========= CARD ========= */
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      padding: 26px 24px;
      margin-bottom: 18px;
      overflow: hidden;
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .card.holo:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 54px rgba(0, 0, 0, 0.45), 0 0 34px rgba(74, 217, 228, 0.15);
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      pointer-events: none;
      border-color: var(--neon);
      opacity: 0.7;
    }

    .card::before {
      top: 6px;
      left: 6px;
      border-top: 2px solid;
      border-left: 2px solid;
    }

    .card::after {
      bottom: 6px;
      right: 6px;
      border-bottom: 2px solid;
      border-right: 2px solid;
    }

    /* ========= LOGIN ========= */
    .login-card {
      max-width: 420px;
      margin: 80px auto 0;
    }

    .login-card h2 {
      margin: 0 0 6px;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .login-card p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .login-card .logo-lg {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--neon-2), var(--neon));
      font-size: 26px;
      margin-bottom: 20px;
      box-shadow: 0 0 26px rgba(124, 92, 255, 0.55);
      animation: pulseGlow 2.5s ease-in-out infinite;
    }

    @keyframes pulseGlow {

      0%,
      100% {
        box-shadow: 0 0 26px rgba(124, 92, 255, 0.55);
      }

      50% {
        box-shadow: 0 0 40px rgba(74, 217, 228, 0.7);
      }
    }

    /* ========= FORM ELEMENTS ========= */
    input,
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(6, 10, 22, 0.72);
      color: var(--text);
      font-size: 14px;
      outline: none;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      letter-spacing: 0.4px;
      transition: all .18s;
    }

    [data-theme="light"] input,
    [data-theme="light"] select {
      background: rgba(255, 255, 255, 0.9);
    }

    input::placeholder {
      color: #4a5674;
      font-weight: 500;
    }

    [data-theme="light"] input::placeholder {
      color: #8a99b8;
    }

    input:focus,
    select:focus {
      border-color: var(--neon);
      background: rgba(10, 20, 40, 0.85);
      box-shadow: 0 0 0 3px rgba(74, 217, 228, 0.15), 0 0 22px rgba(74, 217, 228, 0.22);
    }

    [data-theme="light"] input:focus,
    [data-theme="light"] select:focus {
      background: rgba(255, 255, 255, 0.95);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #7c8dab 50%),
        linear-gradient(135deg, #7c8dab 50%, transparent 50%);
      background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 36px;
      cursor: pointer;
    }

    label {
      display: block;
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 2.5px;
      font-weight: 700;
      margin: 16px 0 7px;
    }

    label:first-child {
      margin-top: 0;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: transform .12s, opacity .15s, box-shadow .2s, background .15s;
      position: relative;
      overflow: hidden;
    }

    button:active {
      transform: scale(0.98);
    }

    .ripple {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      animation: rippleAnim .6s ease-out;
    }

    @keyframes rippleAnim {
      to {
        transform: translate(-50%, -50%) scale(20);
        opacity: 0;
      }
    }

    .btn-primary {
      width: 100%;
      margin-top: 18px;
      padding: 13px 16px;
      color: #030710;
      font-weight: 800;
      font-size: 12px;
      border-radius: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, var(--neon), var(--neon-2));
      box-shadow: 0 0 24px rgba(74, 217, 228, 0.5), inset 0 0 12px rgba(255, 255, 255, 0.15);
    }

    .btn-primary::after {
      content: "";
      position: absolute;
      top: 0;
      left: -60%;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
      transform: skewX(-20deg);
      animation: shine 3s ease-in-out infinite;
    }

    @keyframes shine {

      0%,
      100% {
        left: -60%;
      }

      50% {
        left: 120%;
      }
    }

    .btn-primary:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn-primary:disabled::after {
      animation: none;
    }

    .btn-small {
      padding: 11px 18px;
      color: #030710;
      font-weight: 800;
      font-size: 11.5px;
      border-radius: 10px;
      margin-top: 18px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(135deg, var(--neon), var(--neon-2));
      box-shadow: 0 0 20px rgba(74, 217, 228, 0.45), inset 0 0 10px rgba(255, 255, 255, 0.15);
    }

    .btn-danger {
      background: rgba(255, 77, 106, 0.10);
      color: var(--danger);
      border: 1px solid rgba(255, 77, 106, 0.45);
      padding: 7px 13px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
    }

    .btn-danger:hover {
      background: rgba(255, 77, 106, 0.2);
      box-shadow: 0 0 14px rgba(255, 77, 106, 0.4);
    }

    .error {
      color: #ff7c92;
      font-size: 12.5px;
      margin-top: 10px;
      min-height: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .ok {
      color: #6ee7a0;
      font-size: 12.5px;
      margin-top: 10px;
      min-height: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .hidden {
      display: none !important;
    }

    /* ========= TABS ========= */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      background: rgba(6, 10, 22, 0.7);
      border: 1px solid var(--border);
      padding: 6px;
      border-radius: 12px;
      overflow-x: auto;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    [data-theme="light"] .tabs {
      background: rgba(255, 255, 255, 0.6);
    }

    .tab {
      flex: 1;
      text-align: center;
      white-space: nowrap;
      padding: 11px 14px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: all .15s;
      position: relative;
      overflow: hidden;
    }

    .tab:hover {
      color: var(--text-2);
    }

    .tab.active {
      color: #030710;
      background: linear-gradient(135deg, var(--neon), var(--neon-2));
      box-shadow: 0 0 18px rgba(74, 217, 228, 0.45), inset 0 0 8px rgba(255, 255, 255, 0.15);
    }

    /* ========= HEADINGS ========= */
    h3 {
      margin: 0 0 18px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--neon);
      text-shadow: 0 0 12px rgba(74, 217, 228, 0.4);
    }

    .section-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 26px 0 12px;
    }

    .section-h h3 {
      margin: 0;
    }

    .count-pill {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: var(--neon);
      background: rgba(74, 217, 228, 0.1);
      border: 1px solid rgba(74, 217, 228, 0.4);
      padding: 4px 11px;
      border-radius: 999px;
      letter-spacing: 1.5px;
      box-shadow: 0 0 10px rgba(74, 217, 228, 0.25);
    }

    /* ========= ROWS ========= */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 7px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      transition: all .18s;
    }

    .row:hover {
      background: rgba(30, 42, 70, 0.7);
      border-color: var(--border-strong);
      transform: translateX(2px);
    }

    [data-theme="light"] .row:hover {
      background: rgba(230, 238, 250, 0.95);
    }

    .row.top-tier {
      background: linear-gradient(90deg, rgba(124, 92, 255, 0.14), rgba(74, 217, 228, 0.06), transparent);
      border-color: rgba(124, 92, 255, 0.35);
    }

    .row .main {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .row .sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.5;
    }

    .row .sub .dot {
      opacity: .5;
      margin: 0 6px;
    }

    /* ========= RANK BADGES ========= */
    .rank-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-2);
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    [data-theme="light"] .rank-badge {
      background: rgba(0, 0, 0, 0.04);
    }

    .rank-badge.img {
      width: 52px;
      height: 52px;
      border-radius: 0;
      background: none;
      border: none;
      filter: drop-shadow(0 6px 16px rgba(74, 217, 228, 0.5));
      animation: badgePop .6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .rank-badge.img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @keyframes badgePop {
      from {
        opacity: 0;
        transform: scale(0.4) rotate(-14deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .pts {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      color: var(--neon);
      font-size: 12.5px;
      letter-spacing: 0.5px;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(74, 217, 228, 0.5);
    }

    .empty {
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
      padding: 22px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: rgba(10, 16, 30, 0.4);
      letter-spacing: 1px;
    }

    [data-theme="light"] .empty {
      background: rgba(240, 245, 252, 0.7);
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media(max-width:520px) {
      .grid2 {
        grid-template-columns: 1fr;
      }
    }

    /* ========= ASSIGNMENT BLOCK (compact) ========= */
    .assign-block {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(6, 10, 22, 0.6);
      border: 1px solid var(--border);
    }

    [data-theme="light"] .assign-block {
      background: rgba(240, 245, 252, 0.7);
    }

    .assign-block>label {
      margin: 0 0 8px;
      font-size: 9.5px;
      letter-spacing: 2px;
    }

    .radio-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .radio-opt {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: rgba(10, 16, 30, 0.5);
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-2);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-family: 'Orbitron', sans-serif;
      transition: all .15s;
      line-height: 1;
      position: relative;
      overflow: hidden;
    }

    [data-theme="light"] .radio-opt {
      background: rgba(255, 255, 255, 0.7);
    }

    .radio-opt:hover {
      border-color: var(--border-strong);
    }

    .radio-opt input {
      width: 12px;
      height: 12px;
      margin: 0;
      accent-color: var(--neon);
      cursor: pointer;
      flex-shrink: 0;
    }

    .radio-opt.checked {
      border-color: var(--neon);
      background: rgba(74, 217, 228, 0.10);
      color: var(--text);
      box-shadow: 0 0 12px rgba(74, 217, 228, 0.28);
    }

    .student-picker {
      margin-top: 12px;
      max-height: 230px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      background: rgba(4, 8, 20, 0.6);
    }

    [data-theme="light"] .student-picker {
      background: rgba(255, 255, 255, 0.7);
    }

    .pick-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: background .12s;
    }

    .pick-item:hover {
      background: rgba(74, 217, 228, 0.06);
    }

    .pick-item input {
      width: auto;
      margin: 0;
      accent-color: var(--neon);
      cursor: pointer;
    }

    .pick-item .name {
      flex: 1;
      color: var(--text);
      font-weight: 600;
    }

    .pick-item .code {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      color: var(--neon);
      letter-spacing: 1.5px;
      background: rgba(74, 217, 228, 0.08);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(74, 217, 228, 0.25);
    }

    /* ========= CHIPS ========= */
    .chip {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(124, 92, 255, 0.14);
      color: #c7bcff;
      border: 1px solid rgba(124, 92, 255, 0.35);
      margin-right: 4px;
      margin-top: 4px;
      letter-spacing: 0.8px;
    }

    .chip.all {
      background: rgba(74, 217, 228, 0.1);
      color: #a5eef6;
      border-color: rgba(74, 217, 228, 0.4);
      box-shadow: 0 0 10px rgba(74, 217, 228, 0.2);
    }

    .student-picker::-webkit-scrollbar {
      width: 8px;
    }

    .student-picker::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
    }

    .student-picker::-webkit-scrollbar-thumb {
      background: rgba(74, 217, 228, 0.35);
      border-radius: 8px;
    }

    .student-picker::-webkit-scrollbar-thumb:hover {
      background: rgba(74, 217, 228, 0.55);
    }

    /* ========= TOAST ========= */
    #toast-container {
      position: fixed;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9997;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      max-width: 92vw;
    }

    .toast {
      padding: 14px 20px;
      border-radius: 12px;
      background: rgba(10, 16, 30, 0.95);
      color: #e8f4ff;
      border: 1px solid var(--border-strong);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.3px;
      opacity: 0;
      transform: translateY(-20px);
      transition: all .35s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: auto;
      max-width: 440px;
      line-height: 1.5;
    }

    [data-theme="light"] .toast {
      color: #0c1a2e;
      background: rgba(255, 255, 255, 0.97);
    }

    .toast.in {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-success {
      border-color: rgba(110, 231, 160, 0.5);
      box-shadow: 0 0 24px rgba(110, 231, 160, 0.25);
    }

    .toast-error {
      border-color: rgba(255, 124, 146, 0.55);
      box-shadow: 0 0 24px rgba(255, 124, 146, 0.3);
    }

    .toast-rankup {
      border-color: rgba(255, 209, 102, 0.65);
      background: linear-gradient(135deg, rgba(30, 20, 60, 0.98), rgba(10, 16, 30, 0.98));
      box-shadow: 0 0 40px rgba(255, 209, 102, 0.4), inset 0 0 20px rgba(255, 209, 102, 0.08);
      font-size: 14.5px;
    }
  </style>
</head>

<body>

  <canvas id="particles-canvas"></canvas>

  <div class="toolbar">
    <button class="tool-btn no-ripple" data-theme-toggle title="Toggle theme">☀</button>
    <button class="tool-btn no-ripple" data-sound-toggle title="Toggle sound">🔊</button>
  </div>

  <div id="loader">
    <div class="loader-emblem"><span>⚙️</span></div>
    <div class="loader-text">Initializing…</div>
    <div class="loader-bar"></div>
  </div>

  <div class="wrap">

    <!-- LOGIN -->
    <div id="loginView" class="card login-card holo">
      <div class="logo-lg">⚙️</div>
      <h2>Admin Access</h2>
      <p>Authenticate to manage students, tasks, and rankings.</p>
      <label for="pwInput">Password</label>
      <input id="pwInput" type="password" placeholder="••••••••" autocomplete="current-password">
      <button class="btn-primary" id="loginBtn" onclick="doLogin()">Authenticate</button>
      <div class="error" id="loginError"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashView" class="hidden">

      <div class="top">
        <div class="brand">
          <div class="logo">⚙️</div>
          <div>
            <h1>Admin Console</h1>
            <p>Control Panel · v2.1</p>
          </div>
        </div>
        <button class="logout-top" onclick="doLogout()">Sign Out</button>
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="rank" onclick="switchTab('rank')">Leaderboard</div>
        <div class="tab" data-tab="points" onclick="switchTab('points')">Assign Points</div>
        <div class="tab" data-tab="students" onclick="switchTab('students')">Students</div>
        <div class="tab" data-tab="tasks" onclick="switchTab('tasks')">Tasks</div>
      </div>

      <!-- Ranking -->
      <div id="tab-rank" class="card holo">
        <h3>Live Leaderboard</h3>
        <div id="lbList"></div>
      </div>

      <!-- Points -->
      <div id="tab-points" class="card holo hidden">
        <h3>Assign / Update Points</h3>
        <label>Student</label>
        <select id="pStudent"></select>
        <label>Task</label>
        <select id="pTask"></select>
        <label>Points</label>
        <input id="pPoints" type="text" inputmode="numeric" placeholder="e.g. 10">
        <button class="btn-small" onclick="assignPoints()">Save Points</button>
        <div class="ok" id="pointsMsg"></div>
      </div>

      <!-- Students -->
      <div id="tab-students" class="card holo hidden">
        <h3>Register New Student</h3>
        <div class="grid2">
          <div>
            <label>Code</label>
            <input id="sCode" type="text" placeholder="e.g. K7NQ4X2M">
          </div>
          <div>
            <label>Full Name</label>
            <input id="sName" type="text" placeholder="e.g. Aarav Sharma">
          </div>
        </div>
        <label>Email Address</label>
        <input id="sEmail" type="email" placeholder="student@email.com">
        <button class="btn-small" onclick="addStudent()">Add &amp; Send Code</button>
        <div class="ok" id="studentMsg"></div>

        <div class="section-h">
          <h3>All Students</h3>
          <span class="count-pill" id="studentCount">0</span>
        </div>
        <div id="studentList"></div>
      </div>

      <!-- Tasks -->
      <div id="tab-tasks" class="card holo hidden">
        <h3>Create New Task</h3>
        <label>Task Name</label>
        <input id="tName" type="text" placeholder="e.g. Watch: Intro to Arrays">
        <label>Video Link (optional)</label>
        <input id="tLink" type="text" placeholder="https://...">
        <label>Max Points</label>
        <input id="tMax" type="text" inputmode="numeric" placeholder="e.g. 10">

        <div class="assign-block">
          <label>Assign To</label>
          <div class="radio-group">
            <label class="radio-opt checked" id="optAll">
              <input type="radio" name="assignMode" value="all" checked onchange="toggleAssignMode()">
              All Students
            </label>
            <label class="radio-opt" id="optSpecific">
              <input type="radio" name="assignMode" value="specific" onchange="toggleAssignMode()">
              Specific Students
            </label>
          </div>
          <div id="studentPickList" class="student-picker hidden"></div>
        </div>

        <button class="btn-small" onclick="addTask()">Create Task</button>
        <div class="ok" id="taskMsg"></div>

        <div class="section-h">
          <h3>All Tasks</h3>
          <span class="count-pill" id="taskCount">0</span>
        </div>
        <div id="taskList"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="effects.js"></script>
  <script src="admin.js"></script>
</body>

</html>
